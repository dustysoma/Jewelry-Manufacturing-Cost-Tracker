<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jewelry MFG</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAA/4QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAARERERAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"">
  <style>
    body{font-family:system-ui; margin:0; padding:16px; background:#f6f6f7;}
    .card{background:#fff; border-radius:14px; padding:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-bottom:12px;}
    .row{display:flex; gap:10px; flex-wrap:wrap;}
    label{font-size:12px; opacity:.7;}
    input,select,button{font-size:16px; padding:10px; border-radius:10px; border:1px solid #ddd; width:100%; box-sizing:border-box;}
    button{border:none; background:#111; color:#fff; font-weight:600;}
    button.secondary{background:#e9e9ee; color:#111;}
    .half{flex:1; min-width:160px;}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; white-space:pre-wrap;}
    .total{font-size:20px; font-weight:800;}
  </style>
</head>
<body>
  <h2 style="margin:0 0 12px;">Jewelry Manufacturing</h2>

  <div style="margin-bottom:12px;">
    <button style="margin-right:8px; width:auto; padding:8px 16px;" onclick="showSection('editor')">Editor</button>
    <button style="margin-right:8px; width:auto; padding:8px 16px;" onclick="loadRateCardsSection()">Rate Cards</button>
    <button style="width:auto; padding:8px 16px;" onclick="loadJobsIndex()">Saved Jobs</button>
  </div>

  <div id="editorSection" style="display:block;">
  <div class="card" style="margin-bottom:12px;">
    <h3 style="margin:0 0 8px;">Piece Image</h3>
    <div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:1; min-width:220px;">
        <label style="font-size:12px; opacity:.8;">Upload (optional)</label>
        <input id="imageInput" type="file" accept="image/*" onchange="previewImage()" style="margin-top:6px; width:100%;">
      </div>
      <div id="imagePreview" style="min-width:200px; max-width:260px; display:none; text-align:right;">
        <img id="previewImg" style="max-width:240px; max-height:240px; border-radius:8px; border:1px solid #ddd;">
      </div>
    </div>
  </div>
  <div class="card">
    <h3 style="margin:0 0 10px;">1) Order</h3>
    <div class="row">
      <div class="half">
        <label>Existing Orders</label>
        <select id="orderSelect"></select>
      </div>
      <div class="half">
        <label>New Order (client name)</label>
        <input id="newOrderName" placeholder="Walk-in / John Smith / etc">
      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button onclick="createOrder()">Create Order</button>
      <button class="secondary" onclick="loadOrders()">Refresh</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;">2) Piece</h3>
    <div class="row">
      <div class="half">
        <label>Pieces for selected order</label>
        <select id="pieceSelect"></select>
      </div>
      <div class="half">
        <label>New Piece name</label>
        <input id="newPieceName" placeholder="Ruby Signet Ring - Size 5">
      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button onclick="createPiece()">Create Piece</button>
      <button class="secondary" onclick="loadPieces()">Refresh Pieces</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;">3) Specs + Metal Pricing</h3>

    <div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
      <div style="flex:1; min-width:320px;">
        <div class="row">
          <div class="half">
            <label>Metal</label>
            <select id="metal">
              <option value="">(select)</option>
              <option>GOLD</option>
              <option>SILVER</option>
              <option>PLATINUM</option>
            </select>
          </div>
          <div class="half">
            <label>Alloy</label>
            <select id="alloy">
              <option value="">(select)</option>
              <option>10K</option><option>14K</option><option>18K</option>
              <option>925</option>
              <option>PT950</option>
            </select>
          </div>
          <div class="half">
            <label>Finished weight (g)</label>
            <input id="weight" type="number" step="0.01" placeholder="e.g. 8.50">
          </div>
          <div class="half">
            <label>Loss % (e.g. 7 for 7%)</label>
            <input id="loss" type="number" step="0.1" placeholder="e.g. 7">
          </div>
          <div class="half">
            <label>Premium per g (your shop)</label>
            <input id="premium" type="number" step="0.01" placeholder="e.g. 1.50">
          </div>
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button onclick="savePiece()">Save Specs</button>
      <button class="secondary" onclick="snapshotMetals()">Snapshot Metals</button>
    </div>

    <div style="margin-top:10px;">
      <div><label>Snapshot ID</label></div>
      <div style="margin-top:6px;">
        <input id="snapshotId" class="half" readonly placeholder="(click Snapshot Metals)" />
      </div>
    </div>
  </div>



  <div class="card">
    <h3 style="margin:0 0 10px;">4) Add Costs (Rate Cards)</h3>
    <div class="row">
      <div class="half">
        <label>Category</label>
        <select id="rateCategory" onchange="loadRateCards()">
          <option value="">(all)</option>
          <option>SETTING</option>
          <option>STONE</option>
          <option>POLISH</option>
          <option>PLATING</option>
          <option>ENGRAVING</option>
          <option>ENAMEL</option>
          <option>INLAY</option>
          <option>CAD</option>
          <option>PRINT</option>
          <option>MISC</option>
        </select>
      </div>
      <div class="half">
        <label>Rate Card</label>
        <select id="rateCardSelect"></select>
      </div>
      <div class="half">
        <label>Qty</label>
        <input id="rateQty" type="number" step="1" value="1">
        <div class="half">
  <label>Unit price (from rate card)</label>
  <input id="unitPrice" readonly>
</div>
<div class="half">
  <label>Override unit price (optional)</label>
  <input id="overrideUnitPrice" type="number" step="0.01" placeholder="leave blank to use rate card">
</div>
<div class="half">
  <label>Line total (qty × unit price)</label>
  <input id="lineTotal" readonly>
</div>

      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <button onclick="addFromRateCard()">Add to Piece</button>
      <button class="secondary" onclick="refreshSummary()">Refresh Summary</button>
    </div>

    <div style="margin-top:10px;">
      <label>Manual line item (for Ruby cost, special cases, etc.)</label>
      <div class="row">
        <input class="half" id="mCat" placeholder="Category (STONE/MISC/etc)">
        <input class="half" id="mName" placeholder="Name (Ruby 5mm, etc)">
        <input class="half" id="mUnit" placeholder="Unit (stone/job/carat)">
        <input class="half" id="mQty" type="number" step="1" value="1">
        <input class="half" id="mCost" type="number" step="0.01" placeholder="Unit cost">
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="secondary" onclick="addManual()">Add Manual Item</button>
      </div>
    </div>

    <div style="margin-top:12px; padding:12px; border:1px solid #eee; border-radius:12px; background:#fafafa;">
      <h4 style="margin:0 0 10px;\">Line Items (Costs Added)</h4>
      <div id="lineItemsList" style="max-height:250px; overflow-y:auto; border:1px solid #ddd; border-radius:8px; padding:8px; font-size:13px; font-family:ui-monospace, monospace;">
        (none yet)
      </div>
    </div>
  </div>

<div class="card">
  <h3 style="margin:0 0 10px;\">5) Totals</h3>
  <div class="total" id="totalCost">$0.00</div>

  <div style="margin-top:12px; padding:12px; border:1px solid #eee; border-radius:12px;">
    <h3 style="margin:0 0 10px;\">Quote</h3>
    <div class="row\">
      <div class="half">
        <label>CAD cost</label>
        <input id="cadCost" readonly>
      </div>
      <div class="half">
        <label>CAD price (200% markup → ×3)</label>
        <input id="cadPrice" readonly>
      </div>
      <div class="half">
        <label>Other costs (setting/stones/finish/etc.)</label>
        <input id="otherCost" readonly>
      </div>
      <div class="half">
        <label>Other price (50% markup → ×1.5)</label>
        <input id="otherPrice" readonly>
      </div>
      <div class="half">
        <label>Metal (no markup)</label>
        <input id="metalCostBox" readonly>
      </div>
      <div class="half">
        <label>Quote total</label>
        <input id="quoteTotal" readonly>
      </div>
    </div>
  </div>

  <div style="margin-top:12px;">
    <label>Job notes (optional)</label>
    <div class="row">
      <input class="half" id="jobNotes" placeholder="Notes for invoice or expenses">
      <div class="half" style="display:flex; align-items:flex-end;">
        <button onclick="saveJob()">Save Job</button>
      </div>
    </div>
  </div>

  <div class="mono" id="summary" style="margin-top:12px;"></div>
</div>
  </div><!-- end editorSection -->

  <div id="jobsSection" style="display:none;">
    <div class="card">
      <h3 style="margin:0 0 10px;">Saved Jobs Index</h3>
      <div id="jobsIndex" style="margin-top:12px;">Loading...</div>
    </div>
  </div><!-- end jobsSection -->

  <div id="rateCardsSection" style="display:none;">
    <div class="card">
      <h3 style="margin:0 0 10px;">Manage Rate Cards</h3>
      
      <div style="margin-bottom:20px; padding:12px; border:1px solid #eee; border-radius:12px; background:#fafafa;">
        <h4 style="margin:0 0 10px;">Create New Rate Card</h4>
        <div class="row">
          <div class="half">
            <label>Category</label>
            <select id="newRateCat">
              <option>SETTING</option>
              <option>STONE</option>
              <option>POLISH</option>
              <option>PLATING</option>
              <option>ENGRAVING</option>
              <option>ENAMEL</option>
              <option>INLAY</option>
              <option>CAD</option>
              <option>PRINT</option>
              <option>MISC</option>
            </select>
          </div>
          <div class="half">
            <label>Name (e.g. Prong Setting, Rhodium Plating)</label>
            <input id="newRateName" placeholder="Descriptive name">
          </div>
          <div class="half">
            <label>Unit Type (stone, job, piece, gram, hour, etc.)</label>
            <input id="newRateUnit" placeholder="e.g. stone, job, piece">
          </div>
          <div class="half">
            <label>Unit Cost ($)</label>
            <input id="newRateCost" type="number" step="0.01" placeholder="e.g. 15.50">
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <button onclick="createRateCard()">Add Rate Card</button>
        </div>
      </div>

      <h4 style="margin:12px 0 10px;">Existing Rate Cards</h4>
      <div id="rateCardsList" style="margin-top:12px;">Loading...</div>
    </div>
  </div><!-- end rateCardsSection -->


<script>
  let rateCardsCache = [];
  let currentJobId = null;  // Track currently loaded job for edit vs create
  
  // Save job UI helpers
  function jobNotes(){ const el = sel('jobNotes'); return el ? el.value.trim() : ''; }

  function showSection(section){
    const editor = sel('editorSection');
    const jobs = sel('jobsSection');
    const ratecards = sel('rateCardsSection');
    
    if (editor) editor.style.display = 'none';
    if (jobs) jobs.style.display = 'none';
    if (ratecards) ratecards.style.display = 'none';
    
    if (section === 'editor' && editor) editor.style.display = 'block';
    else if (section === 'jobs' && jobs) jobs.style.display = 'block';
    else if (section === 'ratecards' && ratecards) ratecards.style.display = 'block';
  }

  async function loadRateCardsSection(){
    showSection('ratecards');
    const r = await fetch(api('/api/rate-cards'));
    const cards = await r.json();

    // Group by category
    const byCategory = {};
    for (const card of cards){
      if (!byCategory[card.category]) byCategory[card.category] = [];
      byCategory[card.category].push(card);
    }

    // Render
    let html = '';
    for (const cat of Object.keys(byCategory).sort()){
      const catCards = byCategory[cat];
      html += `<h4 style="margin:12px 0 8px; font-weight:600;">${cat}</h4>`;
      for (const card of catCards){
        html += `
          <div style="padding:8px; margin:4px 0; border:1px solid #eee; border-radius:6px; background:#fafafa; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong>${card.name}</strong> — $${card.unit_cost.toFixed(2)} / ${card.unit_type}
              <div style="font-size:12px; opacity:0.7; margin-top:2px;">ID: ${card.id} ${card.active ? '' : '(inactive)'}</div>
            </div>
          </div>
        `;
      }
    }

    const listEl = sel('rateCardsList');
    if (listEl) listEl.innerHTML = html || '(no rate cards)';
  }

  async function loadJobsIndex(){
    showSection('jobs');
    const r = await fetch(api('/api/jobs-with-orders'));
    const jobs = await r.json();

    // Group by client_name
    const byClient = {};
    for (const job of jobs){
      if (!byClient[job.client_name]) byClient[job.client_name] = [];
      byClient[job.client_name].push(job);
    }

    // Render
    let html = '';
    for (const client of Object.keys(byClient).sort()){
      const clientJobs = byClient[client];
      html += `<h4 style="margin:12px 0 8px; font-weight:600;">${client}</h4>`;
      for (const job of clientJobs){
        const date = new Date(job.created_at).toLocaleDateString();
        const thumb = job.piece_image_data ? `<img src="${job.piece_image_data}" style="width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid #ddd; margin-right:10px;">` : '';
        html += `
          <div onclick="viewJob(${job.id})" style="padding:8px; margin:4px 0; border:1px solid #eee; border-radius:6px; background:#fafafa; cursor:pointer;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; align-items:center;">
                ${thumb}
                <div>
                  <strong>${job.piece_name}</strong> — $${job.total_cost.toFixed(2)} on ${date}
                  <div style="font-size:12px; opacity:0.7; margin-top:4px;">${job.notes || '(no notes)'}</div>
                </div>
              </div>
              <div style="font-size:12px; text-align:right;">
                ID: ${job.id}
                <div style="margin-top:6px;">
                  <button onclick="event.stopPropagation(); deleteJob(${job.id})" style="padding:4px 8px; font-size:12px; background:#ff4444; color:white; border:none; border-radius:4px; cursor:pointer;">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    const jobsEl = sel('jobsIndex');
    if (jobsEl) jobsEl.innerHTML = html || '(no saved jobs)';
  }

  // Load a saved job into the editor for viewing/editing
  async function viewJob(jobId){
    const r = await fetch(api(`/api/jobs/${jobId}`));
    if (!r.ok) return alert('Failed to load job: ' + r.status);
    const job = await r.json();

    // Track that we're editing this job
    currentJobId = jobId;

    // Ensure orders and pieces are loaded so selects contain options
    await loadOrders();
    if (job.order_id && sel('orderSelect')){
      const orderSelect = sel('orderSelect');
      if (![...orderSelect.options].some(o => o.value == String(job.order_id))){
        orderSelect.insertAdjacentHTML('afterbegin', `<option value="${job.order_id}">#${job.order_id} — (unknown)</option>`);
      }
      orderSelect.value = job.order_id;
      await loadPieces();
    }

    if (job.piece_id && sel('pieceSelect')){
      const pieceSelect = sel('pieceSelect');
      if (![...pieceSelect.options].some(o => o.value == String(job.piece_id))){
        pieceSelect.insertAdjacentHTML('afterbegin', `<option value="${job.piece_id}">#${job.piece_id} — (unknown)</option>`);
      }
      pieceSelect.value = job.piece_id;
      await loadPieceIntoForm();
    }

    // Populate notes and switch to editor view
    if (sel('jobNotes')) sel('jobNotes').value = job.notes || '';
    showSection('editor');

    // Refresh lists and summary to reflect the loaded job
    await refreshLineItemsList();
    await refreshSummary();
  }

  async function deleteJob(jobId){
    if (!confirm('Delete this saved job?')) return;
    const r = await fetch(api(`/api/jobs/${jobId}`), { method: 'DELETE' });
    if (!r.ok) return alert('Failed to delete job: ' + r.status);
    await loadJobsIndex();
    alert('Job deleted');
  }

  const api = (path) => location.origin + path;

  function sel(id){ return document.getElementById(id); }
  function currentOrderId(){ return parseInt(sel('orderSelect').value || '0'); }
  function currentPieceId(){ return parseInt(sel('pieceSelect').value || '0'); }

  async function loadOrders(){
    const r = await fetch(api('/api/orders'));
    const data = await r.json();
    sel('orderSelect').innerHTML = data.map(o => `<option value="${o.id}">#${o.id} — ${o.client_name}</option>`).join('');
    if (data.length) await loadPieces();
  }

  async function createOrder(){
    const name = sel('newOrderName').value.trim() || 'Walk-in';
    const r = await fetch(api('/api/orders?client_name=' + encodeURIComponent(name)), {method:'POST'});
    await r.json();
    sel('newOrderName').value = '';
    currentJobId = null;  // Clear job context when creating new order
    await loadOrders();
  }

  async function createRateCard(){
    const cat = sel('newRateCat').value.trim();
    const name = sel('newRateName').value.trim();
    const unit = sel('newRateUnit').value.trim();
    const cost = sel('newRateCost').value;

    if (!cat || !name || !unit || cost === '') return alert('Fill all rate card fields');

    const params = new URLSearchParams({category:cat, name:name, unit_type:unit, unit_cost:cost});
    const r = await fetch(api(`/api/rate-cards?` + params.toString()), {method:'POST'});
    
    if (!r.ok) return alert('Error: ' + r.status + ' ' + r.statusText);
    
    await r.json();
    sel('newRateName').value = ''; sel('newRateUnit').value=''; sel('newRateCost').value='';
    await loadRateCards();
    
    // Refresh the rate cards section list if we're viewing it
    const rateCardsSection = sel('rateCardsSection');
    if (rateCardsSection && rateCardsSection.style.display !== 'none') {
      await loadRateCardsSection();
    }
  }

  async function loadPieces(){
    const oid = currentOrderId();
    if (!oid) return;
    const r = await fetch(api(`/api/orders/${oid}/pieces`));
    const data = await r.json();
    sel('pieceSelect').innerHTML = data.map(p => `<option value="${p.id}">#${p.id} — ${p.name}</option>`).join('');
    if (data.length) await loadPieceIntoForm();
  }

  async function refreshLineItemsList(){
    const pid = currentPieceId();
    if (!pid) return;
    const r = await fetch(api(`/api/pieces/${pid}/line-items`));
    const items = await r.json();

    const listEl = sel('lineItemsList');
    if (!listEl) return;

    if (!items || items.length === 0) {
      listEl.innerHTML = '(none yet)';
      return;
    }

    listEl.innerHTML = items.map(li => `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #eee;">
        <span><strong>${li.category}</strong> — ${li.name} (${li.qty}x $${li.unit_cost} = $${(li.qty * li.unit_cost).toFixed(2)})</span>
        <button style="padding:4px 8px; font-size:12px; background:#ff4444; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="deleteLineItem(${li.id})">✕</button>
      </div>
    `).join('');
  }

  async function deleteLineItem(liId){
    if (!confirm('Remove this cost?')) return;
    const r = await fetch(api(`/api/line-items/${liId}`), {method:'DELETE'});
    if (!r.ok) return alert('Error deleting: ' + r.status);
    await refreshLineItemsList();
    await refreshSummary();
  }

  async function createPiece(){
    const oid = currentOrderId();
    if (!oid) return alert('Select an order first');
    const name = sel('newPieceName').value.trim() || 'Piece';
    const r = await fetch(api(`/api/orders/${oid}/pieces?name=` + encodeURIComponent(name)), {method:'POST'});
    await r.json();
    sel('newPieceName').value = '';
    currentJobId = null;  // Clear job context when creating new piece
    await loadPieces();
  }

  async function loadPieceIntoForm(){
    const pid = currentPieceId();
    if (!pid) return;
    const r = await fetch(api(`/api/pieces/${pid}`));
    const p = await r.json();
    sel('metal').value = p.metal || '';
    sel('alloy').value = p.alloy || '';
    sel('weight').value = p.finished_weight_g ?? '';
    sel('loss').value = (p.loss_pct ?? 0) * 100;
    
    // Load existing image if present
    if (p.image_data) {
      const previewDiv = sel('imagePreview');
      const previewImg = sel('previewImg');
      if (previewDiv && previewImg) {
        previewImg.src = p.image_data;
        previewDiv.style.display = 'block';
      }
    } else {
      const previewDiv = sel('imagePreview');
      if (previewDiv) previewDiv.style.display = 'none';
    }
    
    await refreshLineItemsList();
    await refreshSummary();
  }

  function previewImage(){
    const input = sel('imageInput');
    const file = input.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
      const previewDiv = sel('imagePreview');
      const previewImg = sel('previewImg');
      if (previewDiv && previewImg) {
        previewImg.src = e.target.result;
        previewDiv.style.display = 'block';
      }
    };
    reader.readAsDataURL(file);
  }

  async function uploadPieceImage(){
    const pid = currentPieceId();
    if (!pid) return alert('Select a piece first');
    
    const input = sel('imageInput');
    const file = input.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = async (e) => {
      const base64 = e.target.result;
      const params = new URLSearchParams({ image_data: base64 });
      const r = await fetch(api(`/api/pieces/${pid}/image?` + params.toString()), { method: 'POST' });
      if (!r.ok) return alert('Error uploading image: ' + r.status);
      await r.json();
    };
    reader.readAsDataURL(file);
  }

  async function savePiece(){
    const pid = currentPieceId();
    if (!pid) return alert('Select a piece first');

    const metal = sel('metal').value;
    const alloy = sel('alloy').value;
    const weight = sel('weight').value;
    const lossPct = sel('loss').value;

    const params = new URLSearchParams();
    if (metal) params.set('metal', metal);
    if (alloy) params.set('alloy', alloy);
    if (weight !== '') params.set('finished_weight_g', weight);
    if (lossPct !== '') params.set('loss_pct', (parseFloat(lossPct)/100).toString());

    const r = await fetch(api(`/api/pieces/${pid}?` + params.toString()), {method:'PATCH'});
    await r.json();
    
    // Upload image if one is selected
    await uploadPieceImage();
    
    await refreshSummary();
  }

  async function snapshotMetals(){
    const r = await fetch(api('/api/metals/snapshot'), {method:'POST'});
    if (!r.ok) return alert('Snapshot failed: ' + r.status);
    const snap = await r.json();
    const el = sel('snapshotId');
    if (el) el.value = snap.id;
    await refreshSummary();
  }

  async function saveJob(){
    const pid = currentPieceId();
    if (!pid) return alert('Select a piece first');
    const snap = sel('snapshotId').value || '';
    const notes = jobNotes();

    if (currentJobId) {
      // Update existing job
      const params = new URLSearchParams();
      if (notes) params.set('notes', notes);
      const r = await fetch(api(`/api/jobs/${currentJobId}?` + params.toString()), { method: 'PATCH' });
      if (!r.ok) return alert('Error updating job: ' + r.status);
      const job = await r.json();
      alert('Job updated (id ' + job.id + ')');
    } else {
      // Create new job
      const params = new URLSearchParams({ piece_id: pid.toString() });
      if (snap) params.set('snapshot_id', snap);
      if (notes) params.set('notes', notes);

      const r = await fetch(api('/api/jobs?' + params.toString()), { method: 'POST' });
      if (!r.ok) return alert('Error saving job: ' + r.status);
      const job = await r.json();
      currentJobId = job.id;  // Track the newly created job
      alert('Job saved (id ' + job.id + ')');
    }
  }

  async function loadRateCards(){
  const cat = sel('rateCategory').value;
  const url = cat ? `/api/rate-cards?category=${encodeURIComponent(cat)}` : '/api/rate-cards';
  const r = await fetch(api(url));
  const data = await r.json();
  rateCardsCache = data;

  sel('rateCardSelect').innerHTML = data.map(rc =>
    `<option value="${rc.id}">${rc.category} — ${rc.name} ($${rc.unit_cost}/${rc.unit_type})</option>`
  ).join('');

  updateRateCardPricePreview();
}

function updateRateCardPricePreview(){
  const rateId = parseInt(sel('rateCardSelect').value || '0');
  const qty = parseFloat(sel('rateQty').value || '1');
  const override = sel('overrideUnitPrice').value;

  const rc = rateCardsCache.find(x => x.id === rateId);
  if (!rc) {
    sel('unitPrice').value = '';
    sel('lineTotal').value = '';
    return;
  }

  const unit = (override !== '' ? parseFloat(override) : rc.unit_cost) || 0;
  sel('unitPrice').value = unit.toFixed(2);
  sel('lineTotal').value = (unit * qty).toFixed(2);
}


  async function addFromRateCard(){
  const pid = currentPieceId();
  if (!pid) return alert('Select a piece first');

  const rateId = parseInt(sel('rateCardSelect').value || '0');
  if (!rateId) return alert('Select a rate card first');
  
  const qty = sel('rateQty').value || 1;

  const override = sel('overrideUnitPrice').value;
  const extra = override !== '' ? `&unit_cost_override=${encodeURIComponent(override)}` : '';

  const r = await fetch(api(`/api/pieces/${pid}/line-items/from-rate-card?rate_card_id=${rateId}&qty=${qty}${extra}`), {method:'POST'});
  if (!r.ok) return alert('Error: ' + r.status + ' ' + r.statusText);
  await r.json();

  sel('overrideUnitPrice').value = '';
  updateRateCardPricePreview();
  await refreshLineItemsList();
  await refreshSummary();
}


  async function addManual(){
    const pid = currentPieceId();
    if (!pid) return alert('Select a piece first');

    const cat = sel('mCat').value.trim();
    const name = sel('mName').value.trim();
    const unit = sel('mUnit').value.trim();
    const qty = sel('mQty').value || 1;
    const cost = sel('mCost').value || 0;

    if (!cat || !name || !unit) return alert('Fill category, name, unit');

    const params = new URLSearchParams({category:cat, name:name, unit_type:unit, qty:qty, unit_cost:cost});
    const r = await fetch(api(`/api/pieces/${pid}/line-items?` + params.toString()), {method:'POST'});
    await r.json();

    sel('mCat').value = ''; sel('mName').value=''; sel('mUnit').value=''; sel('mQty').value=1; sel('mCost').value='';
    await refreshLineItemsList();
    await refreshSummary();
  }

  async function refreshSummary(){
    const pid = currentPieceId();
    if (!pid) return;

    const snapEl = sel('snapshotId');
    const premiumEl = sel('premium');
    const snap = snapEl ? snapEl.value : '';
    const premium = premiumEl ? (premiumEl.value || 0) : 0;

    let url = `/api/pieces/${pid}/summary`;
    const params = new URLSearchParams();
    if (snap) params.set('snapshot_id', snap);
    if (premium) params.set('premium_per_g', premium);
    if ([...params].length) url += `?${params.toString()}`;

    const r = await fetch(api(url));
    const data = await r.json();

    const total = data.total_cost ?? 0;
    const totalCostEl = sel('totalCost');
    const summaryEl = sel('summary');
    if (totalCostEl) totalCostEl.textContent = `$${total.toFixed(2)}`;
    if (summaryEl) summaryEl.textContent = JSON.stringify(data, null, 2);
    updateQuoteBox(data);

  }
function updateQuoteBox(summary){
  const metalCost = Number(summary.metal_cost || 0);

  const items = summary.line_items || [];
  let cadCost = 0;
  let otherCost = 0;

  for (const li of items){
    const lineTotal = (Number(li.qty || 0) * Number(li.unit_cost || 0));
    const cat = String(li.category || '').toUpperCase();

    if (cat === 'CAD') cadCost += lineTotal;
    else otherCost += lineTotal;
  }

  const cadPrice = cadCost * 3.0;       // 200% markup
  const otherPrice = otherCost * 1.5;   // 50% markup
  const quoteTotal = metalCost + cadPrice + otherPrice;

  const cadCostEl = sel('cadCost');
  const cadPriceEl = sel('cadPrice');
  const otherCostEl = sel('otherCost');
  const otherPriceEl = sel('otherPrice');
  const metalCostBoxEl = sel('metalCostBox');
  const quoteTotalEl = sel('quoteTotal');
  
  if (cadCostEl) cadCostEl.value = cadCost.toFixed(2);
  if (cadPriceEl) cadPriceEl.value = cadPrice.toFixed(2);
  if (otherCostEl) otherCostEl.value = otherCost.toFixed(2);
  if (otherPriceEl) otherPriceEl.value = otherPrice.toFixed(2);
  if (metalCostBoxEl) metalCostBoxEl.value = metalCost.toFixed(2);
  if (quoteTotalEl) quoteTotalEl.value = quoteTotal.toFixed(2);
}

  sel('orderSelect').addEventListener('change', loadPieces);
  sel('pieceSelect').addEventListener('change', loadPieceIntoForm);
sel('rateCardSelect').addEventListener('change', updateRateCardPricePreview);
sel('rateQty').addEventListener('input', updateRateCardPricePreview);
sel('overrideUnitPrice').addEventListener('input', updateRateCardPricePreview);

  // init
  (async function(){
    await loadOrders();
    await loadRateCards();
  })();
</script>
